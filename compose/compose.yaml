services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: finnip-brain
    restart: unless-stopped
    volumes:
      - ../data/hermes:/opt/data
      # Model choice shared with the voice gateway (finnip-models plugin).
      - ../data/models:/opt/finnip-models
    command: gateway run
    env_file:
        - ../config/hermes-bridge.env
    environment:
      FINNIP_BRIDGE_URL: http://home-bridge:3000
      # API server reachable inside the Compose network only (no published port); voice-gateway uses it.
      API_SERVER_HOST: 0.0.0.0
      MODEL_STATE: /opt/finnip-models/model.json

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: finnip-homeassistant
    restart: unless-stopped
    network_mode: host
    privileged: false
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      TZ: America/Mexico_City
    volumes:
      - ../data/homeassistant:/config
      - /run/dbus:/run/dbus:ro

  home-bridge:
    build:
      context: ../apps/home-bridge
    container_name: finnip-home-bridge
    restart: unless-stopped
    env_file:
      - ../config/homeassistant.env
    environment:
      HA_URL: http://host.docker.internal:8123
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 3D printer (USB serial, CH340). Web UI at http://print.finnip through Caddy.
  octoprint:
    image: octoprint/octoprint:latest
    container_name: finnip-octoprint
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:80"
    devices:
      # Stable name for the printer's USB serial; replugging it needs a container restart.
      - /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0:/dev/ttyUSB0
    volumes:
      - ../data/octoprint:/octoprint
  # HTTPS for app.finnip, home.finnip and the tailnet name; replaces `tailscale serve`.
  caddy:
    build:
      context: ../apps/caddy
    container_name: finnip-caddy
    restart: unless-stopped
    network_mode: host
    env_file:
      - ../config/domains.env
    volumes:
      - ../apps/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../data/caddy:/data
      # tailscale_auth (who is connecting) and the certificate of the tailnet name.
      - /var/run/tailscale:/var/run/tailscale
  # DNS for *.finnip, reached through Tailscale split DNS.
  dns:
    image: coredns/coredns:1.12.1
    container_name: finnip-dns
    restart: unless-stopped
    network_mode: host
    user: "0"  # port 53
    env_file:
      - ../config/domains.env
    command: -conf /Corefile
    volumes:
      - ../apps/coredns/Corefile:/Corefile:ro
  voice-gateway:
    build:
      context: ../apps/voice-gateway
    container_name: finnip-voice-gateway
    restart: unless-stopped
    env_file:
      - ../config/voice-gateway.env
    environment:
      HERMES_URL: http://hermes:8642
      # The agenda panel reuses the finnip-calendar plugin's CalDAV reader (iCloud credentials in the env file).
      CALENDAR_PLUGIN: /opt/finnip-calendar/__init__.py
      # Model orders ("usa Opus", "el normal sea GLM") come from the finnip-models plugin; the choice is
      # shared with Hermes (Telegram) in data/models, readable through group 10000.
      MODELS_PLUGIN: /opt/finnip-models-plugin/__init__.py
      MODEL_STATE: /models/model.json
    group_add: ["10000"]
    # Host loopback only: reached through `tailscale serve`, never directly from the LAN.
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      # The built PWA, mounted so a UI rebuild is live without restarting the container.
      - ../apps/finnip-app/dist:/app/static:ro
      - ../apps/finnip-calendar:/opt/finnip-calendar:ro
      - ../apps/finnip-models:/opt/finnip-models-plugin:ro
      - ../data/models:/models
    depends_on:
      - hermes
