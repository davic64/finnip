services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: finnip-brain
    restart: unless-stopped
    volumes:
      - ../data/hermes:/opt/data
    command: gateway run
    env_file:
        - ../config/hermes-bridge.env
    environment:
      FINNIP_BRIDGE_URL: http://home-bridge:3000
      # API server reachable inside the Compose network only (no published port); voice-gateway uses it.
      API_SERVER_HOST: 0.0.0.0

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: finnip-homeassistant
    restart: unless-stopped
    network_mode: host
    privileged: false
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      TZ: America/Mexico_City
    volumes:
      - ../data/homeassistant:/config
      - /run/dbus:/run/dbus:ro

  home-bridge:
    build:
      context: ../apps/home-bridge
    container_name: finnip-home-bridge
    restart: unless-stopped
    env_file:
      - ../config/homeassistant.env
    environment:
      HA_URL: http://host.docker.internal:8123
    extra_hosts:
      - "host.docker.internal:host-gateway"

  voice-gateway:
    build:
      context: ../apps/voice-gateway
    container_name: finnip-voice-gateway
    restart: unless-stopped
    env_file:
      - ../config/voice-gateway.env
    environment:
      HERMES_URL: http://hermes:8642
    # Host loopback only: reached through `tailscale serve`, never directly from the LAN.
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      # The built PWA, mounted so a UI rebuild is live without restarting the container.
      - ../apps/finnip-app/dist:/app/static:ro
    depends_on:
      - hermes
