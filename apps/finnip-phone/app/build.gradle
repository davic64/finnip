plugins {
    id 'com.android.application'
}

// Gateway URL, fixed at build time (-PfinnipUrl=... or FINNIP_URL) so the tailnet name stays out of the repo.
def finnipUrl = (project.findProperty('finnipUrl') ?: System.getenv('FINNIP_URL') ?: 'https://finnip.invalid')
        .toString().replaceAll('/+$', '')

android {
    namespace 'net.finnip.phone'
    compileSdk 35

    defaultConfig {
        applicationId 'net.finnip.phone'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '1.1'
        buildConfigField 'String', 'FINNIP_URL', "\"${finnipUrl}\""
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
