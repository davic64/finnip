<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#020409" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Finnip" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" href="/icons/icon-192.png" />
    <title>Finnip</title>
  </head>
  <body data-state="off">
    <canvas id="holo" class="holo" aria-hidden="true"></canvas>
    <div class="scan" aria-hidden="true"></div>
    <main class="app">
      <header class="top">
        <span class="brand">F.I.N.N.I.P</span>
        <span id="clock" class="clock"></span>
        <span id="net" class="net" title="Conexión"></span>
        <nav class="modes" aria-label="Modo">
          <button data-mode="conversation" class="on" aria-label="Conversación" title="Conversación"><i data-lucide="messages-square"></i></button>
          <button data-mode="single" aria-label="Un mensaje" title="Un mensaje"><i data-lucide="message-square"></i></button>
        </nav>
        <button id="fullscreen" class="icon-btn" aria-label="Pantalla completa" title="Pantalla completa" hidden><i data-lucide="maximize"></i></button>
        <button id="settings-btn" class="icon-btn" aria-label="Ajustes" title="Ajustes"><i data-lucide="settings"></i></button>
      </header>

      <section class="stage">
        <button id="orb" class="orb" aria-label="Hablar con Finnip" aria-pressed="false"></button>
        <div id="hud" class="hud" hidden></div>
        <div id="cards" class="cards" aria-live="polite"></div>
        <div class="readout">
          <p id="status" class="status" aria-live="polite">Toca para hablar</p>
          <p id="metrics" class="metrics" hidden></p>
        </div>
      </section>

    </main>

    <dialog id="settings" class="sheet">
      <form method="dialog">
        <h2>Ajustes</h2>
        <label class="row"><span>Mostrar métricas de latencia</span><input id="opt-metrics" type="checkbox" /></label>
        <button class="done">Listo</button>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
